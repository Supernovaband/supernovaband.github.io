<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" type="image/png" href="images/logo.png">

    <title>SUPERNOVA — Photos</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav>
    <div class="nav-logo">
        SUPERNOVA
    </div>

    <ul class="nav-links">
        <li><a href="index.html">HOME</a></li>
        <li><a href="index.html#live">LIVE</a></li>
        <li><a href="index.html#music">MUSIC</a></li>
        <li><a href="index.html#band">BAND</a></li>
        <li><a href="photos.html" class="active">PHOTOS</a></li>
        <li><a href="index.html#contact">CONTACT</a></li>
    </ul>
</nav>


<header class="photos-hero">

    <div class="photos-hero-content">

        <span>SUPERNOVA — ARCHIVE</span>

        <h1>
            PHOTO<br>
            <span>ARCHIVE.</span>
        </h1>

        <p>
            Live shows, rehearsals, backstage and everything in between.
        </p>

    </div>

</header>


<main>

    <section class="photo-album">

        <div class="photo-album-heading">
            <span>01</span>
            <h2>THE ARCHIVE</h2>
        </div>


        <div class="album-grid">

            <div class="album-photo">
                <img src="images/photo1.jpg" alt="Supernova photo 1">
            </div>

            <div class="album-photo">
                <img src="images/photo2.jpg" alt="Supernova photo 2">
            </div>

            <div class="album-photo">
                <img src="images/photo3.jpg" alt="Supernova photo 3">
            </div>

            <div class="album-photo">
                <img src="images/photo4.jpg" alt="Supernova photo 4">
            </div>

            <div class="album-photo">
                <img src="images/photo5.jpg" alt="Supernova photo 5">
            </div>

            <div class="album-photo">
                <img src="images/photo6.jpg" alt="Supernova photo 6">
            </div>

            <div class="album-photo">
                <img src="images/photo7.jpg" alt="Supernova photo 7">
            </div>

        </div>

    </section>

</main>


<!-- =========================
     IMAGE VIEWER
========================= -->

<div class="photo-lightbox" id="photoLightbox">

    <button class="lightbox-close" id="lightboxClose" type="button">
        ×
    </button>

    <button class="lightbox-arrow lightbox-prev" id="lightboxPrev" type="button">
        ←
    </button>

    <div class="lightbox-image-container">

        <img
            id="lightboxImage"
            src=""
            alt="Supernova photo"
        >

    </div>

    <button class="lightbox-arrow lightbox-next" id="lightboxNext" type="button">
        →
    </button>

</div>


<footer>

    <div>
        <strong>SUPERNOVA</strong>
    </div>

    <div>
        Fredrikstad, Norway · 2026
    </div>

</footer>


<script src="script.js"></script>

</body>
</html>
